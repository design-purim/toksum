<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0ca678" />
  <title>톡셈 · 톡톡 눌러 셈</title>

  <!-- 파비콘: 톡셈 심볼(다크 사각). SVG라 모든 배율에서 또렷. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />

  <!-- PWA 설치 셸(v0.17): manifest가 있어야 안드로이드가 WebAPK(진짜 앱)로 설치해 준다.
       경로는 모두 상대경로 — 라이브가 서브경로(/toksum/)라 절대경로로 쓰면 설치가 조용히 실패한다. -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="톡셈" />

  <!-- Wanted Sans (SIL OFL 1.1, 완전 무료 오픈소스). 분할 서브셋이라 필요한 글자만 로드.
       로드 실패 시 아래 style.css의 시스템 폰트 fallback으로 자연스럽게 대체됩니다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- JS(main.js)가 mountApp()으로 이 안을 실제 UI로 채웁니다. 초기엔 비워둠(로딩 중 잘못된 텍스트 방지). -->
  <div id="app"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
